<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Peer Chat</title>
  <link rel="stylesheet" href="./css/window.css">
</head>
<body>
  <div id="sidebar">
    <div id="myId">Connecting...</div>
    <button id="addBtn">Add new contact</button>
    <div id="contacts"></div>
  </div>
  <div id="chat">
    <div id="messages"></div>
    <div id="inputRow">
      <!-- <input id="input" type="text" placeholder="Type a message" disabled> -->
       <textarea id="input" placeholder="Type a message"></textarea>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div id="modalBox">
      <b id="modalTitle">Add new contact</b>
      <input id="nameInput" type="text" placeholder="User name">
      <textarea id="idInput" placeholder="User ID"></textarea>
      <div>
        <button id="saveBtn">Save</button>
        <button id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="./js/libs/peerjs.min.js"></script>
  <script src="./js/window.js" type="module"></script>
</body>
</html>
